name: Coode APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip'i ac
        run: |
          Z=$(ls *.zip | head -1)
          echo "Zip: $Z"
          unzip -o "$Z" -d src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: APK derle
        working-directory: src
        run: gradle assembleRelease --no-daemon --stacktrace
      - run: cp src/app/build/outputs/apk/release/app-release.apk Coode-3.7.2.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Coode APK (${{ github.run_number }})
          files: Coode-3.7.2.apk
          prerelease: true
